<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mockups Precission</title>
<!--
  Compone los mockups de proyectos con dispositivos modernos.
  Las pantallas se toman de los PNG originales en source/ (recortando la zona de pantalla)
  y se montan en un teléfono de bordes finos con Dynamic Island y una notebook con notch.

  Uso: compose.html?p=portal|argos|kine   (&debug=1 superpone el original al 50% para alinear)
  Exportar: npm run mockups
-->
<style>
  html, body { margin: 0; background: transparent; }
  body.debug { background: #fff; }
  #stage { position: relative; overflow: hidden; }
  #stage > .base { position: absolute; inset: 0; }
  #stage > .ghost { position: absolute; inset: 0; opacity: .45; pointer-events: none; z-index: 99; }

  /* ---------- Teléfono ---------- */
  .phone {
    position: absolute;
    box-sizing: border-box;
    border-radius: calc(var(--u) * 15.5);
    padding: calc(var(--u) * 1.25);
    background: linear-gradient(140deg, #6b6d73 0%, #2c2d31 22%, #1b1b1e 55%, #3d3f44 85%, #6b6d73 100%);
    box-shadow:
      inset 0 0 0 calc(var(--u) * .22) rgba(255, 255, 255, .28),
      inset 0 0 0 calc(var(--u) * .5) #111113,
      0 calc(var(--u) * 5) calc(var(--u) * 9) calc(var(--u) * -3) rgba(10, 6, 4, .45),
      0 calc(var(--u) * 1.5) calc(var(--u) * 3) rgba(10, 6, 4, .2);
  }
  .phone__btn { position: absolute; width: calc(var(--u) * .9); background: linear-gradient(90deg, #2a2b2f, #55575d, #2a2b2f); border-radius: calc(var(--u) * .5); }
  .phone__btn--power { right: calc(var(--u) * -.55); top: 27%; height: 11%; }
  .phone__btn--action { left: calc(var(--u) * -.55); top: 17%; height: 4.5%; }
  .phone__btn--vup { left: calc(var(--u) * -.55); top: 24.5%; height: 7.5%; }
  .phone__btn--vdown { left: calc(var(--u) * -.55); top: 34%; height: 7.5%; }
  .phone__bezel { width: 100%; height: 100%; box-sizing: border-box; background: #000; border-radius: calc(var(--u) * 14.3); padding: calc(var(--u) * 2.5); }
  .phone__screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: calc(var(--u) * 11.8);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--mid);
  }
  .phone__island {
    position: absolute;
    top: calc(var(--u) * 2.4);
    left: 50%;
    width: calc(var(--u) * 29);
    height: calc(var(--u) * 8.4);
    transform: translateX(-50%);
    background: #000;
    border-radius: 999px;
    z-index: 3;
  }
  .phone__island::after {
    content: "";
    position: absolute;
    right: calc(var(--u) * 5);
    top: 50%;
    width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6);
    transform: translateY(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2b3550, #0b0d14 70%);
  }
  .status {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 calc(var(--u) * 8) 0 calc(var(--u) * 10);
    font: 600 calc(var(--u) * 4.1)/1 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.01em;
  }
  .status__icons { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
  .status svg { display: block; fill: currentColor; }
  .crop { flex: none; background-repeat: no-repeat; }
  .crop--main { flex-shrink: 1; min-height: 0; }
  .spacer { flex: 1 1 auto; }
  .home { flex: none; position: relative; }
  .home::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 32%;
    width: calc(var(--u) * 36); height: calc(var(--u) * 1.3);
    transform: translateX(-50%);
    border-radius: 999px;
    background: var(--indicator);
  }
  .glare {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 28%);
  }

  /* ---------- Notebook ---------- */
  .laptop__lid {
    position: absolute;
    box-sizing: border-box;
    background: #0b0b0c;
    border-radius: calc(var(--u) * 2.1) calc(var(--u) * 2.1) calc(var(--u) * .5) calc(var(--u) * .5);
    box-shadow:
      inset 0 0 0 calc(var(--u) * .14) #3b3c40,
      inset 0 0 0 calc(var(--u) * .3) #111,
      0 calc(var(--u) * 2) calc(var(--u) * 4) calc(var(--u) * -1.5) rgba(10, 6, 4, .35);
  }
  .laptop__screen { position: absolute; overflow: hidden; border-radius: calc(var(--u) * .6); background-repeat: no-repeat; }
  .laptop__notch {
    position: absolute;
    left: 50%; top: 0;
    width: calc(var(--u) * 7.5); height: calc(var(--u) * 1.9);
    transform: translateX(-50%);
    background: #0b0b0c;
    border-radius: 0 0 calc(var(--u) * .8) calc(var(--u) * .8);
    z-index: 2;
  }
  .laptop__notch::after {
    content: ""; position: absolute; left: 50%; top: 42%;
    width: calc(var(--u) * .55); height: calc(var(--u) * .55);
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #33405f, #07080c 70%);
  }
  .laptop__base {
    position: absolute;
    box-sizing: border-box;
    background: linear-gradient(180deg, #5a5b60 0%, #2f3034 18%, #232427 60%, #151517 100%);
    border-radius: calc(var(--u) * .35) calc(var(--u) * .35) 50% 50% / calc(var(--u) * .35) calc(var(--u) * .35) 100% 100%;
    box-shadow: inset 0 calc(var(--u) * .12) 0 rgba(255, 255, 255, .35);
  }
  .laptop__base::before {
    content: ""; position: absolute; left: 50%; top: 0;
    width: 14%; height: 34%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #121214, #2a2b2f);
    border-radius: 0 0 calc(var(--u) * .8) calc(var(--u) * .8);
  }
  .laptop__floor {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(10, 6, 4, .38), rgba(10, 6, 4, 0) 70%);
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* Coordenadas en píxeles de cada PNG original (source/).
   body   = caja del teléfono viejo, que el nuevo tapa por completo
   main   = recorte principal de la pantalla (va arriba, debajo de la barra de estado)
   bottom = recorte opcional anclado abajo (barras de navegación / botones)            */
const PROJECTS = {
  portal: {
    src: 'source/Portal_Ciudadano.png', w: 1596, h: 1605, base: true,
    phones: [{ body: [428, 148, 718, 1440], main: [488, 334, 604, 925], bottom: [488, 1281, 604, 128] }],
  },
  kine: {
    src: 'source/KineMobil.png', w: 1710, h: 1643, base: true,
    phones: [{ body: [12, 18, 744, 1502], main: [68, 197, 631, 1114] }],
  },
  argos: {
    src: 'source/Argos.png', w: 1814, h: 1156, base: false,
    laptop: { screen: [237, 62, 1353, 845] },
    phones: [{ body: [52, 226, 470, 940], main: [90, 382, 396, 570], bottom: [90, 960, 396, 84] }],
  },
};

const params = new URLSearchParams(location.search);
const cfg = PROJECTS[params.get('p') || 'portal'];
const debug = params.has('debug');
const stage = document.getElementById('stage');
stage.style.width = cfg.w + 'px';
stage.style.height = cfg.h + 'px';
if (debug) document.body.classList.add('debug');

const STATUS_ICONS = `
  <svg viewBox="0 0 18 12" style="width:calc(var(--u)*4.4)"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg viewBox="0 0 16 12" style="width:calc(var(--u)*4)"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4A10.4 10.4 0 008 .3 10.4 10.4 0 00.7 3.2L2 4.6a8.5 8.5 0 016-2.4zm0 3.7c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 008 4a6.8 6.8 0 00-4.7 1.8l1.3 1.4c.9-.8 2.1-1.3 3.4-1.3zM8 9.5l1.8-1.9A2.6 2.6 0 008 6.9c-.7 0-1.3.3-1.8.7z"/></svg>
  <svg viewBox="0 0 27 13" style="width:calc(var(--u)*6.4)"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity=".45"/></svg>`;

(async () => {
  const img = new Image();
  img.src = cfg.src;
  await img.decode();
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  // Color promedio de una franja (para extender fondos de la app)
  const sample = (x, y, w, h) => {
    const d = ctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 200) continue; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    n = n || 1; return [r / n, g / n, b / n];
  };
  const css = (c) => `rgb(${c.map(Math.round).join(',')})`;
  const isDark = (c) => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 150;

  const cropDiv = (rect, width, cls) => {
    const [x, y, w, h] = rect; const s = width / w;
    const el = document.createElement('div');
    el.className = 'crop ' + cls;
    el.style.height = (h * s) + 'px';
    el.style.backgroundImage = `url(${cfg.src})`;
    el.style.backgroundSize = `${cfg.w * s}px ${cfg.h * s}px`;
    el.style.backgroundPosition = `${-x * s}px ${-y * s}px`;
    return el;
  };

  if (cfg.base) {
    const base = new Image(); base.src = cfg.src; base.className = 'base'; stage.appendChild(base);
  }

  // ---------- Notebook ----------
  if (cfg.laptop) {
    const [sx, sy, sw, sh] = cfg.laptop.screen;
    const u = sw / 100;
    const side = u * 1.55, top = u * 1.9, bottom = u * 2.3;
    const lid = document.createElement('div');
    lid.className = 'laptop__lid';
    Object.assign(lid.style, { '--u': u + 'px', left: sx - side + 'px', top: sy - top + 'px', width: sw + side * 2 + 'px', height: sh + top + bottom + 'px' });
    lid.style.setProperty('--u', u + 'px');
    const screen = document.createElement('div');
    screen.className = 'laptop__screen';
    Object.assign(screen.style, {
      left: side + 'px', top: top + 'px', width: sw + 'px', height: sh + 'px',
      backgroundImage: `url(${cfg.src})`, backgroundPosition: `${-sx}px ${-sy}px`, backgroundSize: `${cfg.w}px ${cfg.h}px`,
    });
    const notch = document.createElement('div'); notch.className = 'laptop__notch';
    screen.appendChild(notch);
    lid.appendChild(screen);

    const lidBottom = sy + sh + bottom;
    const baseW = sw + side * 2 + u * 11;
    const baseEl = document.createElement('div');
    baseEl.className = 'laptop__base';
    baseEl.style.setProperty('--u', u + 'px');
    Object.assign(baseEl.style, { left: sx - side - u * 5.5 + 'px', top: lidBottom - u * .15 + 'px', width: baseW + 'px', height: u * 2.6 + 'px' });
    const floor = document.createElement('div');
    floor.className = 'laptop__floor';
    Object.assign(floor.style, { left: sx - side - u * 4 + 'px', top: lidBottom + u * 1.2 + 'px', width: baseW - u * 3 + 'px', height: u * 3 + 'px' });
    stage.append(floor, lid, baseEl);
  }

  // ---------- Teléfonos ----------
  for (const ph of cfg.phones) {
    const [bx, by, bw, bh] = ph.body;
    const u = bw / 100;
    const el = document.createElement('div');
    el.className = 'phone';
    Object.assign(el.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
    el.style.setProperty('--u', u + 'px');
    el.innerHTML = `<i class="phone__btn phone__btn--power"></i><i class="phone__btn phone__btn--action"></i>
      <i class="phone__btn phone__btn--vup"></i><i class="phone__btn phone__btn--vdown"></i>
      <div class="phone__bezel"><div class="phone__screen"><div class="phone__island"></div><div class="glare"></div></div></div>`;
    stage.appendChild(el);

    const screen = el.querySelector('.phone__screen');
    const W = screen.clientWidth, H = screen.clientHeight;
    const [mx, my, mw, mh] = ph.main;
    const topColor = sample(mx + 4, my + 2, mw - 8, 4);
    const midColor = sample(mx + 4, my + mh - 5, mw - 8, 4);
    screen.style.setProperty('--mid', css(midColor));

    const status = document.createElement('div');
    status.className = 'status';
    status.style.height = H * 0.062 + 'px';
    status.style.background = css(topColor);
    status.style.color = isDark(topColor) ? '#fff' : '#111';
    status.innerHTML = `<span>9:41</span><span class="status__icons">${STATUS_ICONS}</span>`;
    screen.appendChild(status);
    screen.appendChild(cropDiv(ph.main, W, 'crop--main'));
    const spacer = document.createElement('div'); spacer.className = 'spacer'; screen.appendChild(spacer);

    let homeColor = midColor;
    if (ph.bottom) {
      const [x2, y2, w2, h2] = ph.bottom;
      homeColor = sample(x2 + 4, y2 + h2 - 5, w2 - 8, 4);
      screen.appendChild(cropDiv(ph.bottom, W, ''));
    }
    const home = document.createElement('div');
    home.className = 'home';
    home.style.height = H * 0.038 + 'px';
    home.style.background = css(homeColor);
    home.style.setProperty('--indicator', isDark(homeColor) ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.85)');
    screen.appendChild(home);
  }

  if (debug) { const g = new Image(); g.src = cfg.src; g.className = 'ghost'; stage.appendChild(g); }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
